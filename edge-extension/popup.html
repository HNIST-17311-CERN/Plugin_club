<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <h1>页面数据提取</h1>
  </div>

  <div class="page-info">
    <span class="label">当前页面</span>
    <span class="title" id="pageTitle">—</span>
  </div>

  <div class="config-panel" id="configPanel">
    <div class="config-row">
      <label>DeepSeek Key</label>
      <input id="dsKey" class="apikey-input" type="password" placeholder="sk-...">
      <button id="saveKeyBtn" class="btn-small">保存</button>
    </div>
    <div class="config-hint" id="configHint"></div>
  </div>

  <div class="tab-bar" id="tabBar">
    <button class="tab-btn active" data-tab="images">图片</button>
    <button class="tab-btn" data-tab="data">数据</button>
    <button class="tab-btn" data-tab="network">网络</button>
  </div>

  <!-- ====== 图片 Tab ====== -->
  <div class="tab-content active" id="tab-images">
    <div class="actions">
      <button id="extractBtn" class="btn-primary">提取图片</button>
    </div>
    <div class="content-area">
      <div class="loading hidden" id="loading">
        <div class="spinner"></div>
        <span id="loadingText">正在滚动加载图片...</span>
      </div>
      <div class="error hidden" id="error"></div>
      <div class="image-section hidden" id="imageSection">
        <div class="image-toolbar">
          <label class="check-all"><input type="checkbox" id="selectAll"> 全选</label>
          <span class="select-count" id="selectCount">已选 0 张</span>
          <button id="downloadSelected" class="btn-small btn-dl" disabled>下载选中</button>
        </div>
        <div class="image-grid" id="imageGrid"></div>
        <div class="download-progress hidden" id="downloadProgress">
          <span id="progressText">下载中...</span>
          <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        </div>
      </div>
      <div class="image-preview hidden" id="imagePreview">
        <button id="closePreview" class="close-btn">&times;</button>
        <img id="previewImg" src="" alt="">
        <div class="preview-info">
          <span id="previewUrl"></span>
          <button id="copyUrlBtn" class="btn-small">复制链接</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ====== 网络 Tab ====== -->
  <div class="tab-content" id="tab-network">
    <div class="actions">
      <button id="netRefreshBtn" class="btn-primary">刷新并抓取</button>
      <button id="netAiBtn" class="btn-primary btn-ai">AI 一键分析</button>
    </div>
    <div class="actions" style="padding-top:0">
      <button id="netFetchBtn" class="btn-outline">查看结果</button>
      <button id="netExportBtn" class="btn-small btn-dl hidden">导出 JSON</button>
    </div>
    <div class="net-hint">先刷新并抓取，再查看结果或AI一键分析</div>
    <div class="content-area">
      <div class="net-status hidden" id="netStatus"></div>
      <div class="net-list hidden" id="netList"></div>
      <div class="net-ai hidden" id="netAi"></div>
      <div class="net-detail hidden" id="netDetail">
        <button id="netBackBtn" class="btn-small">← 返回</button>
        <div class="net-detail-content" id="netDetailContent"></div>
      </div>
    </div>
  </div>

  <!-- ====== 数据 Tab ====== -->
  <div class="tab-content" id="tab-data">
    <div class="actions">
      <button id="extractDataBtn" class="btn-primary">提取页面数据</button>
    </div>
    <div class="content-area">
      <div class="loading hidden" id="dataLoading">
        <div class="spinner"></div>
        <span id="dataLoadingText">正在提取页面数据...</span>
      </div>
      <div class="error hidden" id="dataError"></div>
      <div class="data-section hidden" id="dataSection">
        <div class="data-toolbar">
          <span id="dataSummary"></span>
          <label class="key-toggle"><input type="checkbox" id="keyOnly"> 仅看重点</label>
          <button id="exportDataBtn" class="btn-small btn-dl">导出 JSON</button>
        </div>
        <div class="sig-result hidden" id="sigResult"></div>
        <div class="key-findings hidden" id="keyFindings"></div>
        <div class="data-tree" id="dataTree"></div>
      </div>
    </div>
  </div>

  <div class="footer">
    <span id="statusText">就绪</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
